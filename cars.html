<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-05 CO. | Collection</title>
    <link rel="stylesheet" href="style.css">

<body>

    <header class="navbar">
        <div class="logo">
            <span class="checker-icon">🏁</span> P-05 CO.

        <nav class="nav-links">
            <a href="cars.html" class="active">Car</a>

        <div class="menu-wrapper">
            <button class="menu-toggle" id="menuToggle" aria-label="Toggle Menu">
                <span class="bar"></span>
                <span class="bar"></span>
                <span class="bar"></span>
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
                <a href="index.html" class="menu-item">Home</a>
                <a href="#" class="menu-item disabled" onclick="return false;">About</a>
                <a href="cars.html" class="menu-item active">Cars</a>
            </div>

    <main class="collection-container">
        
        <h1 class="collection-title">COLLECTION</h1>
        <span class="collection-subtitle">ALL</span>

        <div class="slider-wrapper">
            <button class="slider-arrow prev-arrow" id="prevBtn" aria-label="Previous Car">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
            </button>

            <div class="slider-frame">
                <img src="C:\Users\Anabell\Downloads\CAR PROJECT MTCH\car-DJ-car.jpg" alt="Collection Car" class="slider-image">
            </div>

            <button class="slider-arrow next-arrow" id="nextBtn" aria-label="Next Car">
                <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                    <polyline points="12 5 19 12 12 19"></polyline>
                </svg>
            </button>
        </div>

        <div class="action-wrapper">
            <a href="product.html" class="purchase-button" id="purchaseBtn">
                <span>Purchase</span>
                <div class="arrow-circle">
                    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="5" y1="12" x2="19" y2="12"></line>
                        <polyline points="12 5 19 12 12 19"></polyline>
                    </svg>
                </div>
            </a>
        </div>

    </main>

    <script src="script.js"></script>
