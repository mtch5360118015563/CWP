<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>P-05 CO. | Product View</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <header class="navbar">
        <div class="logo">
            <span class="checker-icon">🏁</span> P-05 CO.
        </div>
        <div class="back-wrapper">
            <a href="cars.html" class="back-link">BACK</a>
        </div>
    </header>

    <main class="product-container">
        
        <div class="product-hero-frame">
            <img id="productImage" src="" alt="Premium Vehicle Spec View">
        </div>

        <div class="product-details-grid">
            
            <div class="info-column">
                <h1 class="product-headline" id="productTitle">VEHICLE MANUFACTURER MODEL</h1>
                <p class="product-history-paragraph" id="productSubtitle">
                    Loading historical context data logs...
                </p>
                <div class="purchase-action-row">
                    <button class="buy-pill-button">BUY</button>
                    <span class="price-display-tag" id="productPrice">PRICE: 000000000</span>
                </div>
            </div>

            <div class="specs-column">
                <h3 class="specs-header-title">SPECS</h3>
                <table class="specs-sheet-table">
                    <thead>
                        <tr>
                            <th>Metric</th>
                            <th>Specification</th>
                        </tr>
                    </thead>
                    <tbody id="specsTableBody">
                        </tbody>
                </table>
            </div>

        </div>

    </main>

    <script src="script.js"></script>
</body>
</html>
